<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#9aa4b2"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <linearGradient id="s" x1="0" x2="1"><stop stop-color="#667085"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#667085"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  <clipPath id="clip"><rect x="0" y="0" width="900" height="300" rx="28"/></clipPath>
</defs>
<rect width="900" height="300" rx="28" fill="#08090c" stroke="#252932"/>
<ellipse cx="450" cy="90" rx="290" ry="75" fill="#fff" opacity=".045" filter="url(#blur)"/>
<g clip-path="url(#clip)">
 <rect x="-220" y="0" width="170" height="300" fill="url(#s)" opacity=".08" transform="skewX(-18)">
  <animate attributeName="x" from="-220" to="980" dur="5s" repeatCount="indefinite"/>
 </rect>
 <text x="450" y="116" text-anchor="middle" fill="url(#g)" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" letter-spacing="8">SHUBH BHANGU
  <animate attributeName="opacity" values=".72;1;.72" dur="3.5s" repeatCount="indefinite"/>
 </text>
 <text x="450" y="160" text-anchor="middle" fill="#8c96a5" font-family="monospace" font-size="14" letter-spacing="5">SYSTEMS  /  SECURITY  /  AI  /  CRYPTOGRAPHY
  <animate attributeName="letter-spacing" values="5;7;5" dur="4s" repeatCount="indefinite"/>
 </text>
 <text x="450" y="214" text-anchor="middle" fill="#cbd1da" font-family="monospace" font-size="15">BUILDING SOFTWARE THAT SURVIVES PRESSURE
  <animate attributeName="y" values="214;210;214" dur="4s" repeatCount="indefinite"/>
 </text>
 <g fill="#fff">
  <circle cx="120" cy="235" r="2"><animate attributeName="cx" values="120;780;120" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="62" r="1.5"><animate attributeName="cx" values="780;120;780" dur="11s" repeatCount="indefinite"/></circle>
 </g>
 <text x="450" y="264" text-anchor="middle" fill="#626b79" font-family="monospace" font-size="11" letter-spacing="3">BUILD → BREAK → VERIFY → HARDEN
  <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/>
 </text>
</g>
</svg>
